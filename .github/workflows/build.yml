name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only by default; only the packaging job may create a release.
permissions:
  contents: read

env:
  # Pinned to the exact patch: govulncheck gates stdlib advisories against
  # whatever toolchain built the tree, so a floating minor means a Go security
  # release reddens CI until the runner image catches up.
  GO_VERSION: '1.26.8'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes over git — the release step authenticates gh
          # through GH_TOKEN — so leaving the token in .git/config only widens
          # what a compromised build step could read.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go vet ./...
      # A module file that is not tidy means the invariant is unwatched, so a
      # genuinely missing or unused requirement would go unnoticed too, until a
      # build broke somewhere unrelated.
      - run: go mod tidy -diff
      # "Only one dependency" (PLAN decision 1, M4 contract §4.5) is a property
      # that decays the moment nobody is checking. golang.org/x/crypto, for
      # break-glass bcrypt, is the first and only require line; a second one
      # fails the build rather than arriving unnoticed in a diff.
      - name: Assert the single-dependency invariant
        run: |
          # Two halves: go.mod may name only x/crypto, and the packages we build
          # may come from only x/crypto. `go list -m all` is the wrong oracle: it
          # prints x/crypto's own transitive graph (x/net, x/sys, x/term, x/text)
          # even though none of it is linked.
          requires=$(go mod edit -json | grep -o '"Path": "[^"]*"' | sed 's/"Path": "//; s/"//' | grep -v '^qnapfilemanager$' || true)
          echo "go.mod requires: $requires"
          [ "$requires" = "golang.org/x/crypto" ] || {
            echo "go.mod must require exactly golang.org/x/crypto; got: $requires"
            exit 1
          }
          linked=$(go list -deps -f '{{if .Module}}{{.Module.Path}}{{end}}' ./... | sort -u | grep -v '^qnapfilemanager$' || true)
          echo "modules linked: $linked"
          [ "$linked" = "golang.org/x/crypto" ] || {
            echo "the build must link only golang.org/x/crypto; got: $linked"
            exit 1
          }
      # -race needs cgo, which is why it cannot run on the Windows dev box and
      # runs here instead — on linux/amd64, the platform half the NAS ships.
      # Do not set CGO_ENABLED: the runner's default of 1 is what it needs, and
      # the package job sets 0 inline where it matters.
      - run: go test -race ./...
      # The UI's node tests are the only M3 logic the dev box exercises without a
      # kernel (m3-contract §14); ubuntu-latest ships node, no setup step needed.
      - run: node --version && node --test internal/web/*.mjs
      # The three-GOOS sweep is mandatory, not belt and braces. Development
      # happens on Windows, where `go vet ./...` never compiles the _linux.go
      # files at all — including, in the sibling project, a type error that
      # reached a release that way.
      - run: GOOS=windows go vet ./...
      # arm_64 is half of every release and nothing else vets it: the package
      # job only builds it.
      - run: GOOS=linux GOARCH=arm64 go vet ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # go vet is clean on this repo and stays clean; the dead-store family
      # (SA4006) is staticcheck's. Pinned so a new release cannot redden CI on
      # an unrelated push.
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
      - run: staticcheck ./...
      # This daemon runs as root, terminates TLS on the break-glass listener
      # and holds a session cookie, so an advisory in crypto/tls or net/http
      # matters to it.
      - name: Vulnerability scan
        run: |
          # Pinned for the same reason staticcheck is: a broken tool release
          # must not redden CI on an unrelated push. The vulnerability DB is
          # fetched live regardless of the scanner's version.
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  # The _windows.go and _other.go half of every platform split is skipped
  # entirely by a Linux build — including its tests, which cannot fail if they
  # are never compiled. Development happens on Windows, so this job is
  # essential rather than optional.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go vet ./...
      - run: go test ./...

  # Every real-process impersonation test is guarded by requireLinuxRoot and
  # therefore skips in the unprivileged `test` job: the production credential
  # boundary — spawning a worker as another uid, and the kernel refusing it
  # what that user may not have — would otherwise be untested in CI, which
  # CLAUDE.md's testing rule (root and ZFS behaviour is covered by the CI jobs)
  # says it must not be. sudo -E env "PATH=$PATH" keeps the toolchain setup-go
  # put on the runner's PATH, which a plain sudo drops with secure_path.
  test-linux-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # setfacl is what gives the POSIX-ACL badge test a real ACL to look at.
      # Without it that test skips, and a silently skipped ACL test is the gap
      # Astra M3 round 1 (finding 16) found in the first place. Conditional, so
      # it costs nothing on an image that already ships it.
      - name: Make sure setfacl is available
        run: command -v setfacl || sudo apt-get install -y --no-install-recommends acl
      # ./cmd/... is here because the break-glass credential-store mode test
      # skips off-root, and this is the only job that is root: leaving it out
      # meant nothing ever executed it (Astra M4 round 1, finding 17).
      # ./internal/breakglass/... for the same reason (Astra r3 #5): the key
      # pair's ownership refusals — a key given away to another uid is the one
      # that only root can even set up — skip everywhere else, so the rule that
      # decides whether the emergency door binds was never executed in CI.
      - run: sudo -E env "PATH=$PATH" go test ./internal/workerpool/... ./internal/fsops/... ./internal/worker/... ./internal/breakglass/... ./cmd/qnapfilemanager/... -run . -count=1

  # QuTS hero mounts one ZFS dataset per shared folder, and that single fact
  # drives the crossing rule, the EXDEV pre-flight, the trash root and the
  # aclmode warning (PLAN.md decisions 9-11). Synthetic mountinfo proves the
  # parser, not the kernel — so this job builds a real file-backed pool and
  # runs the tests gated by QFM_ZFS_TEST against it. It is the only hero
  # coverage that exists without hardware.
  test-zfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # Installs zfsutils-linux, loads the module (falling back to
      # linux-modules-extra for the running kernel), mounts a tmpfs on /share
      # the way QTS has it and builds two pools with three datasets.
      - name: Build the file-backed ZFS fixture
        run: sudo bash scripts/ci-zfs-setup.sh
      # Root because the pool and its datasets are root-owned, and because the
      # mount table under test describes this machine. sudo -E env "PATH=$PATH"
      # keeps the toolchain setup-go put on the runner's PATH, which a plain
      # sudo drops with secure_path.
      - name: Run the ZFS integration tests
        run: sudo -E env "PATH=$PATH" QFM_ZFS_TEST=1 go test -count=1 -run 'ZFS' ./internal/platform/... ./internal/fsops/...

  package:
    needs: [test, test-windows, test-linux-root, test-zfs]
    runs-on: ubuntu-latest
    permissions:
      contents: write # attaching the QPKGs to a release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # Before anything is built, signed or uploaded: a tag that is not
      # vMAJOR.MINOR.PATCH fails the build (M4 contract §12.1). The QDK
      # installer and the checksums file both take the version at its word, so
      # a malformed one would ship a package nobody can reason about.
      - name: Check the tag shape
        if: github.ref_type == 'tag'
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"; exit 1; }

      - name: Build the binaries
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # CGO_ENABLED=0 is what makes these run on QTS's bare userland.
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/$arch/bin/qnapfilemanager" ./cmd/qnapfilemanager
          done

      - name: Assemble the QPKG trees
        run: |
          sed -i "s/^QPKG_VER=.*/QPKG_VER=\"$VERSION\"/" qpkg/qpkg.cfg
          mkdir -p qpkg/x86_64 qpkg/arm_64
          cp -r dist/amd64/. qpkg/x86_64/
          cp -r dist/arm64/. qpkg/arm_64/
          cp config.example.json qpkg/shared/
          chmod -R a+rx qpkg/x86_64 qpkg/arm_64

      # Registers binfmt handlers so the arm_64 tree's binaries execute
      # directly in the smoke test below.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Smoke-test the assembled trees
        run: |
          # Execute the tree, don't just list it: a wrong-arch or accidentally
          # dynamically linked binary still stats fine while dying on QTS, and
          # a broken route table looks identical to a working one from here.
          set -e
          mkdir -p /tmp/fakeroot/etc
          cp /etc/passwd /etc/group /tmp/fakeroot/etc/
          for arch in x86_64 arm_64; do
            tree="qpkg/$arch"
            [ "$("$tree/bin/qnapfilemanager" version)" = "$VERSION" ]
            "$tree/bin/qnapfilemanager" serve -addr 127.0.0.1:18770 \
              -jail /tmp/fakeroot -readonly &
            pid=$!
            ok=
            for i in $(seq 20); do
              if curl -sf localhost:18770/api/session >/dev/null; then ok=1; break; fi
              sleep 0.5
            done
            [ -n "$ok" ] || { echo "$arch: the daemon never answered"; kill $pid; exit 1; }
            # readOnly is the switch that must survive every refactor of the
            # startup path, so the smoke test asserts on it by value.
            curl -sf localhost:18770/api/session | grep -q '"readOnly":true'
            # Unknown API routes answer 401 before routing when nobody is signed in,
            # so the route table cannot be enumerated anonymously.
            [ "$(curl -s -o /dev/null -w '%{http_code}' localhost:18770/api/nope)" = 401 ]
            # M4 contract §2.5 / §16.8: the break-glass listener does NOT bind
            # while no password hash is configured, and this smoke runs with no
            # config file at all. An open port that can never authenticate is
            # pure surface, and this is the property most likely to regress
            # silently — nothing in the UI would look different.
            # `ss` must exist, or the check below would silently pass — the
            # failure mode this test exists to prevent.
            command -v ss >/dev/null || { echo "ss is missing; the 8771 check cannot run"; kill $pid; exit 1; }
            if ss -ltnH | grep -q ':8771 '; then
              echo "$arch: 8771 is bound with no break-glass password configured"
              ss -ltnp | grep ':8771 ' || true
              kill $pid; exit 1
            fi
            # The CLI subcommand runs on the packaged binary, on both trees.
            # `status` reads only: no bcrypt, so qemu emulation stays cheap.
            "$tree/bin/qnapfilemanager" break-glass status -config /tmp/fakeroot/bg.json \
              | grep -q 'password:    not set'
            kill $pid
            wait $pid 2>/dev/null || true
            echo "$arch ok: qnapfilemanager $VERSION"
          done

      - name: Install QDK
        env:
          # Pinned by commit, not by tag. This installer runs as root in the
          # one job holding a release-write token, and a tag is a name its
          # owner can move — so "pinned to v2.5.3" was a wish, not a pin. This
          # is v2.5.3 as it stood when it was reviewed.
          QDK_SHA: 955d98c9913989561142f9a9ac994ec0091559d6
        run: |
          git init /tmp/QDK && cd /tmp/QDK
          git remote add origin https://github.com/qnap-dev/QDK.git
          git fetch --depth 1 origin "$QDK_SHA"
          git checkout --detach FETCH_HEAD
          sudo ./InstallToUbuntu.sh install

      - name: Build the QPKG
        run: |
          cd qpkg
          PATH="$PATH:/usr/share/QDK/bin" qbuild
          ls -l build/

      # The checksums are produced ONCE, here, and the same file is what the
      # artifact carries and what the release attaches: a pre-release build a
      # tester downloads must be verifiable the same way a released one is
      # (M4 contract §12.3).
      - name: Checksum the package
        run: |
          cd qpkg/build
          sha256sum *.qpkg > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qpkg
          path: |
            qpkg/build/*.qpkg
            qpkg/build/SHA256SUMS
          # Not the 90-day default: the sibling project's account-wide artifact
          # quota has blocked releases twice. Releases hold the durable copies.
          retention-days: 7

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The checksum file was written by the step above, so what the release
          # attaches is byte-identical to what the artifact carried.
          gh release create "$GITHUB_REF_NAME" qpkg/build/*.qpkg qpkg/build/SHA256SUMS --generate-notes
