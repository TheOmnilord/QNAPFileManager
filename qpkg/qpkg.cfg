QPKG_NAME="QNAPFileManager"
QPKG_DISPLAY_NAME="File Manager"
# QPKG_VER is overwritten by CI from the git tag.
QPKG_VER="0.1.0"
QPKG_AUTHOR="Sveinung"
QPKG_LICENSE="MIT"
QPKG_SUMMARY="Browse and manage the whole NAS filesystem from the QTS desktop — every path, not just shared folders. Runs each operation as the signed-in user, with permissions, ownership, copy/move, upload/download and search."

QPKG_RC_NUM="198"
QPKG_SERVICE_PROGRAM="QNAPFileManager.sh"

# Declared firmware compatibility — without this App Center shows a generic
# "may be only partially compatible" warning. Self-contained static binary; no
# actual firmware dependency beyond a modern QTS/QuTS hero.
QTS_MINI_VERSION="4.5.0"

# --- QTS desktop embedding (PLAN.md decision 2) ---
# Open in a QTS desktop window, like File Station.
QPKG_DESKTOP_APP="1"
# QTS's Apache reverse-proxies to our loopback port, so the UI is served from
# the QTS origin itself: QTS cookies arrive first-party, there is no mixed
# content and no certificate problem. An own-port iframe cannot work on a NAS
# with Force HTTPS on.
QPKG_USE_PROXY="1"
QPKG_PROXY_PATH="/qnapfilemanager"
# The tile target. It MUST match QPKG_PROXY_PATH, with the trailing slash.
QPKG_WEBUI="/qnapfilemanager/"
# The loopback target of the proxy. 8765 is GitBackup's and is already bound on
# this NAS; 8080/443 are QTS and 8081 the Web Server app. Confirm with
# `netstat -tlnp | sort -t: -k2 -n` before the first release.
QPKG_WEB_PORT="8770"
# Tile visible to non-admin users — every QTS user is meant to be able to open
# this and see exactly what their own account can see. VERIFY the semantics on
# the NAS.
QPKG_VISIBLE="1"
QPKG_VOLUME_SELECT="1"
# Stop needs time to drain per-user workers and running jobs.
QPKG_TIMEOUT="30,60"

QPKG_DIR_ICONS="icons"
